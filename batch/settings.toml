# 비밀이 아닌 조정값. 판정 규칙의 수치(유사도 0.90 · 마감일 180일 · 판별 실패 절반)는 규칙이라 코드에 둔다.
# 근거: CCR-INFRA-001 4.1 · 8.5

[judge]
model = "gpt-6-luna"          # 저장소 변수 OPENAI_MODEL이 있으면 덮는다
timeout_seconds = 30
retries = 2
concurrency = 4
max_output_tokens = 300
backoff_seconds = [2, 4]

[warning]
zero_count_days = 3           # 소스 0건 경고: 0건 직전까지 연속으로 건수를 낸 날 수

[source]
timeout_seconds = 20
retries = 2
backoff_seconds = [2, 4]
retry_after_cap_seconds = 30
interval_seconds = 1.0
page_cap = 20
budget_seconds = 120

[notion]
read_timeout_seconds = 20
write_timeout_seconds = 70
retries = 3
backoff_seconds = [1, 2, 4]
retry_after_cap_seconds = 60
requests_per_second = 3.0
