[project]
name = "competition-collector"
version = "0.1.0"
description = "AI·개발 대회를 매일 모아 목록 파일에 더하는 배치. 페이지가 그 파일을 보여 준다"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "openai>=2.0",
    "selectolax>=0.3.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.16.9",
]

[tool.uv]
required-version = "==0.11.8"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
