# 매일 08:50 KST에 대회를 모아 노션 대회목록에 넣는다. 근거: CCR-INFRA-001 8장
name: daily

on:
  schedule:
    - cron: '50 8 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '노션에 쓰지 않는다(미리보기). 기본 브랜치가 아니면 늘 미리보기다'
        type: boolean
        default: false
      ignore_discards:
        description: '버림 기록을 없는 것으로 보고 판별한다. 미리보기에서만 뜻이 있다'
        type: boolean
        default: false

# 어느 브랜치에서 누른 실행이든 예약 실행과 같은 줄에 선다. 기다리던 실행을 취소하지 않는다
concurrency:
  group: competition-batch
  queue: max

permissions:
  contents: write

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 노션에 쓰는 실행만 쓰기 연결의 토큰을 받는다. 쓰기 여부와 같은 조건이다(CCR-INFRA-001 5.1)
    environment: ${{ (github.ref == 'refs/heads/main' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)) && 'notion-write' || 'notion-read' }}
    env:
      DRY_RUN: ${{ github.ref != 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    steps:
      - name: 시작 시각
        run: |
          echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "RUN_ID=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "APPEND_DIR=${RUNNER_TEMP}/append" >> "$GITHUB_ENV"

      # 기본 브랜치는 시작하는 때의 최신 커밋을 받는다. 트리거 때의 커밋이 아니다
      - name: 코드 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref == 'refs/heads/main' && 'main' || '' }}
          persist-credentials: false

      # 워크플로 정의는 트리거 때의 것이라, 그사이 .github/가 바뀌었으면 코드와 어긋날 수 있다
      - name: 워크플로 정의 확인
        run: |
          if ! git cat-file -e "${GITHUB_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet --no-tags --depth=1 origin "${GITHUB_SHA}"
          fi
          if ! git diff --quiet "${GITHUB_SHA}" HEAD -- .github/; then
            echo "::error::트리거 뒤 .github/가 바뀌었다. 새 수동 실행으로 다시 돌린다"
            exit 1
          fi

      - name: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: batch
          enable-cache: false

      - name: 의존성
        working-directory: batch
        run: uv sync --frozen --no-dev

      # 시크릿은 이 스텝에만 넘긴다. exec로 띄워 끊을 때 오는 신호를 파이썬이 받는다
      - name: 배치
        working-directory: batch
        timeout-minutes: 8
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          IGNORE_DISCARDS: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_discards }}
        run: exec .venv/bin/python -m collector

      # 앞 스텝이 실패하거나 끊겨도 돈다. git과 python3 표준 라이브러리만 쓴다(CCR-INFRA-001 8.2)
      - name: 마무리
        if: always() && github.ref == 'refs/heads/main' && env.DRY_RUN == 'false'
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          export RUN_ID="${RUN_ID:-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}"
          export APPEND_DIR="${APPEND_DIR:-${RUNNER_TEMP}/append}"
          script=batch/finish.py
          if [ ! -f "$script" ]; then
            git clone --quiet --depth=1 --branch main --no-tags "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${RUNNER_TEMP}/finish-code"
            script="${RUNNER_TEMP}/finish-code/batch/finish.py"
          fi
          exec python3 "$script"
