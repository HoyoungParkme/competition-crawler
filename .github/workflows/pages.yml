# 대회 목록 페이지를 빌드해 GitHub Pages에 올린다. 근거: CCR-INFRA-001 8.11
name: pages

# 페이지 코드가 바뀔 때만 배포한다. data/만 바뀌는 배치 · 페이지의 커밋에는 돌지 않는다(CCR-INFRA-001 8.3)
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# 배포가 겹치지 않게 한다. 진행 중인 배포는 끊지 않는다
concurrency:
  group: pages
  cancel-in-progress: false

# deploy-pages가 OIDC 토큰으로 배포한다. 저장소에는 쓰지 않는다
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Pages가 만든 배포 환경. 시크릿은 없고, 배포할 수 있는 브랜치는 Pages 설정이 정한다
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 코드 받기
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성
        working-directory: frontend
        run: npm ci

      - name: 빌드
        working-directory: frontend
        run: npm run build

      - name: Pages 설정
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: 올릴 파일
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

      - name: 배포
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
